# Local development stack: MySQL 8 + S3-compatible storage (MinIO).
# Run the apps on the host with `pnpm dev` for fast reloads.
#   docker compose up -d
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: marea
      MYSQL_USER: marea
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-marea-dev-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-only}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-marea-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-marea-dev-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

volumes:
  mysql-data:
  minio-data:
